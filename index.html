<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1B2D" />
    <meta name="description" content="TERESA — an assistive robotics research concept for autonomous urine collection, disposal and post-use treatment. Includes TERESA Connect, a simulated monitoring dashboard." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,200..700;1,9..40,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <title>TERESA — Autonomous Urine Collector</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>TERESA needs JavaScript to run the site and the simulation.</noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Retire the old TERESA service worker (see public/sw.js).
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.update(); });
        });
      }
    </script>
  </body>
</html>
